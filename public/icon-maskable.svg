<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rhythmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#40916c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8f3dc" />
      <stop offset="100%" stop-color="#b7e4c7" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#rhythmGrad)" />

  <!-- Inner Content scaled inside safe-zone (80% circle) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Soft Ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="8 8" />

    <!-- Left Leaf Curve -->
    <path d="M 256 370 C 256 310, 200 270, 160 270 C 160 210, 220 170, 256 220 C 256 280, 256 330, 256 370 Z" fill="url(#leafGrad)" />
    
    <!-- Right Leaf Curve -->
    <path d="M 256 370 C 256 280, 310 230, 360 210 C 360 150, 290 130, 256 180 C 256 240, 256 310, 256 370 Z" fill="url(#accentGrad)" />

    <!-- Center Golden Pulse Dot -->
    <circle cx="256" cy="170" r="22" fill="#ffd166" />

    <!-- Bottom Root Arc -->
    <path d="M 216 380 Q 256 400 296 380" fill="none" stroke="#52b788" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
